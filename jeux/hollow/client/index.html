<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Hollow · Strate 01</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
  <script type="module" src="main.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ece6da; color: #1a1828; font-family: 'Cormorant Garamond', Georgia, serif; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* retour au dernier appui après une chute : l'image s'efface dans le papier */
    #veil { position: fixed; inset: 0; background: #ece6da; opacity: var(--fade, 0); pointer-events: none; }
    #title { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; cursor: pointer;
      background: radial-gradient(ellipse at center, rgba(236, 230, 218, .55), rgba(236, 230, 218, .92)); transition: opacity 1.6s ease; }
    #title.gone { opacity: 0; pointer-events: none; }
    #title h1 { margin: 0; font-size: clamp(3rem, 11vw, 9rem); font-weight: 700; letter-spacing: .32em; line-height: 1; padding-left: .32em; }
    #title p { margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.7rem); font-style: italic; }
    #title small { margin-top: 26px; font-size: 1rem; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
    #title kbd { font-family: inherit; border-bottom: 1px solid currentColor; }
    #title button { margin-top: 18px; justify-self: center; font: italic 500 1.25rem 'Cormorant Garamond', Georgia, serif; color: inherit; background: none; border: 0; border-bottom: 1px solid currentColor; cursor: pointer; }
    /* le nom de la strate qui arrive, pendant la chute : il s'écrit à l'encre, de gauche à droite, avec une bavure */
    #card { position: fixed; left: 0; right: 0; bottom: 14vh; display: grid; justify-items: center; gap: 4px; pointer-events: none; opacity: 0; }
    #card small { font-size: 1.1rem; letter-spacing: .5em; text-transform: uppercase; }
    #card b { font-size: clamp(2.4rem, 7vw, 5.5rem); font-weight: 700; font-style: italic; filter: url(#bavure); }
    #card.on { animation: card 5s ease forwards; }
    #card.on b, #card.on small { animation: ecrit 2.2s cubic-bezier(.6, .1, .3, 1) forwards; clip-path: inset(0 100% 0 0); }
    #card.on b { animation-delay: .35s; }
    @keyframes ecrit { to { clip-path: inset(0 0 0 0); } }
    @keyframes card { 0% { opacity: 0; } 8% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
    #toast { position: fixed; left: 50%; top: 18vh; transform: translateX(-50%); font-size: 1.5rem; font-style: italic; opacity: 0; pointer-events: none; text-align: center; }
    #toast.on { animation: card 4.5s ease forwards; }
    /* les paroles, écrites à la main au-dessus de celui qui parle */
    #say { position: fixed; transform: translate(-50%, -100%); max-width: min(420px, 80vw); text-align: center; pointer-events: none; font: 700 1.7rem/1.15 Caveat, cursive; color: #1a1828; text-shadow: 0 0 6px #f4efe4, 0 0 12px #f4efe4; opacity: 0; }
    #say.on { opacity: 1; }
    #say.on span { display: inline-block; animation: ecrit 1.6s cubic-bezier(.6, .1, .3, 1) forwards; clip-path: inset(0 100% 0 0); }
    #prompt { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); font: 700 1.5rem Caveat, cursive; padding: 2px 14px; background: rgba(244, 239, 228, .82); border-bottom: 2px solid #1a1828; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #prompt.on { opacity: 1; }
    /* l'encrier */
    #ink { position: fixed; left: 18px; bottom: 18px; width: 34px; height: 52px; border: 2px solid #1a1828; border-radius: 6px 6px 12px 12px; overflow: hidden; background: rgba(244, 239, 228, .7); }
    #ink i { position: absolute; left: 0; right: 0; bottom: 0; background: #2a2048; transition: height .5s; }
    #ink b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 1.2rem Caveat, cursive; color: #f4efe4; mix-blend-mode: difference; }
    #ink.full { box-shadow: 0 0 12px #ffd860; }
    /* le souffle (sous l'eau) : une bande qui se vide, rouge et qui bat quand il en manque */
    #air { position: fixed; left: 18px; bottom: 18px; width: 180px; height: 16px; border: 2px solid #1a1828; border-radius: 9px; overflow: hidden; background: rgba(244, 239, 228, .7); }
    #air[hidden] { display: none; }
    #air::before { content: ''; position: absolute; inset: 0 auto 0 0; width: calc(var(--k, 1) * 100%); background: repeating-radial-gradient(circle at 6px 8px, #7af0e8 0 3px, #4ae8e0 3px 7px); transition: width .25s linear; }
    #air::after { content: 'souffle'; position: absolute; left: 190px; top: -6px; font: 700 1.3rem Caveat, cursive; color: #f4efe4; text-shadow: 0 1px 2px #000; }
    #air.low::before { background: #e85a4a; animation: manque .6s steps(2) infinite; }
    @keyframes manque { 50% { opacity: .35; } }
    /* le carnet */
    #carnet { position: fixed; inset: 5vh 6vw; overflow: auto; padding: 26px 32px; background: #f1ead9; box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 0 60px rgba(120, 90, 40, .2); display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 26px; align-content: start; }
    #carnet[hidden] { display: none; }
    #carnet h2, #carnet small, #carnet .vide { grid-column: 1 / -1; margin: 0; font: italic 700 2.2rem 'Cormorant Garamond', serif; }
    #carnet small { font: 1.1rem Caveat, cursive; opacity: .6; }
    #carnet figure { margin: 0; transform: rotate(-.6deg); }
    #carnet figure:nth-child(odd) { transform: rotate(.8deg); }
    #carnet img { width: 100%; border: 1px solid #1a1828; box-shadow: 3px 4px 0 rgba(26, 24, 40, .2); }
    #carnet figcaption { font: 700 1.5rem Caveat, cursive; text-align: center; }
    #pagetoast { position: fixed; right: 18px; bottom: 18px; font: 700 1.3rem Caveat, cursive; opacity: 0; pointer-events: none; }
    #pagetoast.on { animation: card 4s ease forwards; }
    #warp { position: fixed; right: 16px; top: 14px; font: 700 1.2rem Caveat, cursive; padding: 2px 8px; background: rgba(244, 239, 228, .85); border: 2px solid #1a1828; border-radius: 6px; color: #1a1828; z-index: 5; }
    /* la fin */
    #fin { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 24px; text-align: center; background: rgba(241, 234, 217, .94); z-index: 10; }
    #fin[hidden] { display: none; }
    #fin small { font: 1.1rem 'Cormorant Garamond', serif; letter-spacing: .5em; text-transform: uppercase; }
    #fin h2 { margin: 0; font: italic 700 clamp(2.6rem, 8vw, 5.5rem) 'Cormorant Garamond', serif; filter: url(#bavure); }
    #fin p { margin: 0; max-width: 34em; font: italic 1.35rem 'Cormorant Garamond', serif; }
    #fin div { display: flex; gap: 14px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
    #fin button { font: 700 1.4rem Caveat, cursive; padding: 6px 18px; background: transparent; border: 2px solid #1a1828; border-radius: 6px; cursor: pointer; color: #1a1828; }
    /* l'objectif et son repère */
    #goal { position: fixed; left: 18px; top: 52px; max-width: min(420px, 70vw); font: 700 1.35rem Caveat, cursive; padding: 4px 12px; background: rgba(244, 239, 228, .82); border-left: 3px solid #e8a020; pointer-events: none; }
    #goal[hidden], #mark[hidden] { display: none; }
    #goal.new { animation: objectif .9s ease; }
    @keyframes objectif { 0% { transform: translateX(-12px); opacity: 0; } 100% { transform: none; opacity: 1; } }
    #mark { position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 3px solid #ffd860; transform: rotate(45deg); box-shadow: 0 0 10px #ffd860; pointer-events: none; }
    #mark::after { content: attr(data-d); position: absolute; left: 50%; top: 26px; transform: rotate(-45deg) translateX(-30%); font: 700 1rem Caveat, cursive; color: #fff; text-shadow: 0 1px 2px #000; white-space: nowrap; }
    #mark.off::after { display: none; } /* hors champ, la flèche seule (le texte tournerait avec elle) */
    #mark.off { border-radius: 0 50% 50% 50%; transform: rotate(calc(var(--a) + 135deg)); }
    #menu-btn { position: fixed; left: 46px; top: 12px; font: 700 1.2rem Caveat, cursive; padding: 1px 10px; background: rgba(244, 239, 228, .8); border: 2px solid #1a1828; border-radius: 6px; color: #1a1828; cursor: pointer; z-index: 6; }
    #menu { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; background: rgba(241, 234, 217, .95); z-index: 11; text-align: center; }
    #menu[hidden] { display: none; }
    #menu h2 { margin: 0 0 10px; font: italic 700 3rem 'Cormorant Garamond', serif; }
    #menu button { font: 700 1.5rem Caveat, cursive; padding: 6px 22px; min-width: 300px; background: transparent; border: 2px solid #1a1828; border-radius: 6px; cursor: pointer; color: #1a1828; }
    #menu small { font: 1.05rem Caveat, cursive; opacity: .65; margin-bottom: 8px; }
    a.back { position: fixed; left: 16px; top: 14px; color: inherit; text-decoration: none; font-size: 1.4rem; opacity: .6; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="The Hollow, Strate 01 : les Jardins suspendus"></canvas>
  <div id="veil"></div>
  <div id="card" aria-live="polite"></div>
  <div id="toast" aria-live="polite"></div>
  <div id="say" aria-live="polite"></div>
  <div id="prompt"></div>
  <div id="goal" hidden></div>
  <div id="mark" hidden></div>
  <div id="ink" hidden title="Encre"></div>
  <div id="air" hidden title="Souffle"></div>
  <div id="pagetoast" aria-live="polite"></div>
  <section id="carnet" hidden></section>
  <section id="fin" hidden aria-live="polite"></section>
  <svg width="0" height="0" style="position:absolute"><filter id="bavure"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter></svg>
  <a class="back" href="/" title="Retour au Cercle">←</a>
  <button id="menu-btn" title="Menu (M)">Menu</button>
  <section id="menu" hidden><h2>Menu</h2><button id="menu-close">Reprendre</button><button id="menu-reset">Recommencer le voyage à zéro</button><small>les histoires, les fins et la strate atteinte sont oubliées ; le carnet est gardé</small><button id="menu-wipe">Tout effacer, carnet compris</button><small>M ouvre et ferme ce menu</small></section>
  <section id="title">
    <h1>THE HOLLOW</h1>
    <p>Strate 01 — Les Jardins suspendus</p>
    <button id="resume" hidden></button>
    <button id="fresh" hidden>Nouveau voyage (recommencer à zéro)</button>
    <small>Cliquer pour entrer · <kbd>ZQSD</kbd> marcher · <kbd>Maj</kbd> courir · <kbd>Espace</kbd> sauter · souris : regarder · <kbd>E</kbd> agir · <kbd>C</kbd> carnet · <kbd>R</kbd> tout en couleur</small>
  </section>
</body>
</html>
